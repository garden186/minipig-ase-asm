name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lightweight-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install reporting test dependency
        run: python -m pip install "matplotlib>=3.10,<3.11"
      - name: Check Bash and Python helpers
        run: bash tests/run_checks.sh
